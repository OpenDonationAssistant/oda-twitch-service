micronaut:
  application:
    name: oda-twitch-service
  security:
    token:
      bearer:
        enabled: true
      cookie:
        enabled: true
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${JWKS_URI}
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
  http:
    services:
      # Twitch Helix (and token/id) calls are bounded so a slow Twitch
      # dependency cannot hold redemption processing open indefinitely.
      twitch-api:
        connect-timeout: 2s
        read-timeout: 4s
      twitch-id:
        connect-timeout: 2s
        read-timeout: 4s
  executors:
    command-listener:
      type: fixed
      nThreads: 1
    config-listener:
      type: fixed
      nThreads: 1
twitch:
  client:
    id: ${TWITCH_CLIENT_ID}
    secret: ${TWITCH_CLIENT_SECRET}
rabbitmq:
  rpc:
    # Explicit RabbitMQ RPC timeout for media.add; the framework default is 10s.
    timeout: 5s
flyway:
  datasources:
    default:
      enabled: true
      schemas: 'twitch'
      default-schema: 'twitch'
endpoints:
  prometheus:
    sensitive: false
  metrics:
    sensitive: false
datasources:
  default:
    schema: 'twitch'
